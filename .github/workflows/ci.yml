name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
      - README.md
  pull_request:
    paths-ignore:
      - docs/**
      - README.md
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      USE_MOCK_DATA: "true"
      AUTH_SECRET: ci-auth-secret
      NEXTAUTH_URL: http://127.0.0.1:3107
      AUTH_DEMO_PASSWORD: demo1234
      AUTH_ADMIN_PASSWORD: admin1234
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Quality gates
        run: npm run verify:quality

      - name: Dependency audit (critical gate)
        run: npm audit --omit=dev --audit-level=critical

      - name: Build Vite Worker output
        run: npm run cf:build:vite

      - name: Check deploy output
        run: npm run deploy:check:vite

      - name: Check migration drift
        run: |
          npm run db:generate
          git diff --exit-code drizzle src/db/schema.ts

      - name: Check whitespace
        run: git diff --check

      - name: Validate telemetry alert parser
        run: |
          printf '%s\n' '{"event":"worker_request_complete","status":200,"durationMs":12,"path":"/"}' > telemetry-fixture.jsonl
          npm run ops:check-alerts -- telemetry-fixture.jsonl
          rm telemetry-fixture.jsonl

  e2e-full:
    name: E2E Full
    needs: [verify, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: altteulmap
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d altteulmap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/altteulmap
      USE_MOCK_DATA: "false"
      AUTH_SECRET: ci-auth-secret
      NEXTAUTH_URL: http://127.0.0.1:3107
      AUTH_DEMO_PASSWORD: demo1234
      AUTH_ADMIN_PASSWORD: admin1234
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Restore Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Push schema
        run: ALLOW_LOCAL_MIGRATION=1 npm run db:migrate

      - name: Seed database
        run: npm run db:seed

      - name: Verify migration is repeatable
        run: ALLOW_LOCAL_MIGRATION=1 npm run db:migrate

      - name: Run price concurrency smoke
        run: npm run smoke:price-concurrency

      - name: Run all E2E
        run: npm run test:e2e:all

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  integration:
    name: PostgreSQL Integration
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: altteulmap
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d altteulmap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/altteulmap
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/altteulmap
      USE_MOCK_DATA: "false"
      AUTH_SECRET: ci-auth-secret
      NEXTAUTH_URL: http://127.0.0.1:3107
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: ALLOW_LOCAL_MIGRATION=1 npm run db:migrate

      - name: Seed local database
        run: npm run db:seed

      - name: Run integration and concurrency tests
        run: |
          npm run test:integration
          npm run smoke:price-concurrency
          npm run db:check:contract

  remote-smoke:
    name: Remote Smoke
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_PUBLIC_URL: ${{ secrets.SMOKE_PUBLIC_URL }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
      SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run remote smoke
        run: |
          set -o pipefail
          test -n "$SMOKE_PUBLIC_URL" || { echo "SMOKE_PUBLIC_URL secret is required"; exit 1; }
          test -n "$SMOKE_ADMIN_EMAIL" || { echo "SMOKE_ADMIN_EMAIL secret is required"; exit 1; }
          test -n "$SMOKE_ADMIN_PASSWORD" || { echo "SMOKE_ADMIN_PASSWORD secret is required"; exit 1; }
          export SMOKE_REQUIRE_ADMIN="true"
          if [ -n "$SMOKE_USER_EMAIL" ] || [ -n "$SMOKE_USER_PASSWORD" ]; then
            test -n "$SMOKE_USER_EMAIL" || { echo "SMOKE_USER_EMAIL must be paired with SMOKE_USER_PASSWORD"; exit 1; }
            test -n "$SMOKE_USER_PASSWORD" || { echo "SMOKE_USER_PASSWORD must be paired with SMOKE_USER_EMAIL"; exit 1; }
            export SMOKE_REQUIRE_USER="true"
          fi
          npm run smoke:remote 2>&1 | tee remote-smoke.log

      - name: Upload remote smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-smoke-evidence
          path: remote-smoke.log
          if-no-files-found: ignore
