name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
      - README.md
  pull_request:
    paths-ignore:
      - docs/**
      - README.md
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      USE_MOCK_DATA: "true"
      AUTH_SECRET: ci-auth-secret
      NEXTAUTH_URL: http://127.0.0.1:3107
      AUTH_DEMO_PASSWORD: demo1234
      AUTH_ADMIN_PASSWORD: admin1234
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Build Vite Worker output
        run: npm run cf:build:vite

      - name: Check deploy output
        run: npm run deploy:check:vite

      - name: Check migration drift
        run: |
          npm run db:generate
          git diff --exit-code drizzle src/db/schema.ts

      - name: Check whitespace
        run: git diff --check

  e2e-full:
    name: E2E Full
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: altteulmap
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d altteulmap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/altteulmap
      USE_MOCK_DATA: "false"
      AUTH_SECRET: ci-auth-secret
      NEXTAUTH_URL: http://127.0.0.1:3107
      AUTH_DEMO_PASSWORD: demo1234
      AUTH_ADMIN_PASSWORD: admin1234
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Push schema
        run: npm run db:push

      - name: Seed database
        run: npm run db:seed

      - name: Run full E2E
        run: npm run e2e:prepare && npm run build && npm run test:e2e:full:ci

  remote-smoke:
    name: Remote Smoke
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_PUBLIC_URL: ${{ secrets.SMOKE_PUBLIC_URL }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run remote smoke
        run: |
          export SMOKE_PUBLIC_URL="${SMOKE_PUBLIC_URL:-https://altteulmap.altteul-lab.workers.dev}"
          npm run smoke:remote
