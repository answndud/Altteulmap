name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      USE_MOCK_DATA: "true"
      AUTH_SECRET: ci-auth-secret
      NEXTAUTH_URL: http://127.0.0.1:3107
      AUTH_DEMO_PASSWORD: demo1234
      AUTH_ADMIN_PASSWORD: admin1234
      NEXT_PUBLIC_NAVER_MAP_KEY_ID: ""
      AUTH_KAKAO_CLIENT_ID: ""
      AUTH_KAKAO_CLIENT_SECRET: ""
      AUTH_NAVER_CLIENT_ID: ""
      AUTH_NAVER_CLIENT_SECRET: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: altteulmap
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d altteulmap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/altteulmap
      USE_MOCK_DATA: "false"
      AUTH_SECRET: ci-auth-secret
      NEXTAUTH_URL: http://127.0.0.1:3107
      AUTH_DEMO_PASSWORD: demo1234
      AUTH_ADMIN_PASSWORD: admin1234
      NEXT_PUBLIC_NAVER_MAP_KEY_ID: ""
      AUTH_KAKAO_CLIENT_ID: ""
      AUTH_KAKAO_CLIENT_SECRET: ""
      AUTH_NAVER_CLIENT_ID: ""
      AUTH_NAVER_CLIENT_SECRET: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Push schema
        run: npm run db:push

      - name: Seed database
        run: npm run db:seed

      - name: Run E2E
        run: npm run test:e2e

  deploy-config:
    name: Deploy Config Check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      USE_MOCK_DATA: ${{ vars.USE_MOCK_DATA }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
      NEXT_PUBLIC_NAVER_MAP_KEY_ID: ${{ vars.NEXT_PUBLIC_NAVER_MAP_KEY_ID }}
      AUTH_KAKAO_CLIENT_ID: ${{ vars.AUTH_KAKAO_CLIENT_ID }}
      AUTH_KAKAO_CLIENT_SECRET: ${{ secrets.AUTH_KAKAO_CLIENT_SECRET }}
      AUTH_NAVER_CLIENT_ID: ${{ vars.AUTH_NAVER_CLIENT_ID }}
      AUTH_NAVER_CLIENT_SECRET: ${{ secrets.AUTH_NAVER_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check production deploy config
        run: npm run deploy:check
