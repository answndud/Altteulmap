name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      USE_MOCK_DATA: "true"
      AUTH_SECRET: ci-auth-secret
      NEXTAUTH_URL: http://127.0.0.1:3107
      AUTH_DEMO_PASSWORD: demo1234
      AUTH_ADMIN_PASSWORD: admin1234
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            npm run verify:quick
          else
            npm run verify
          fi

  e2e-smoke:
    name: E2E Smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: altteulmap
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d altteulmap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/altteulmap
      USE_MOCK_DATA: "false"
      AUTH_SECRET: ci-auth-secret
      NEXTAUTH_URL: http://127.0.0.1:3107
      AUTH_DEMO_PASSWORD: demo1234
      AUTH_ADMIN_PASSWORD: admin1234
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Push schema
        run: npm run db:push

      - name: Seed database
        run: npm run db:seed

      - name: Run smoke E2E
        run: npm run e2e:prepare && npm run build && npm run test:e2e:smoke:ci

  e2e-full:
    name: E2E Full
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: altteulmap
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d altteulmap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/altteulmap
      USE_MOCK_DATA: "false"
      AUTH_SECRET: ci-auth-secret
      NEXTAUTH_URL: http://127.0.0.1:3107
      AUTH_DEMO_PASSWORD: demo1234
      AUTH_ADMIN_PASSWORD: admin1234
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Push schema
        run: npm run db:push

      - name: Seed database
        run: npm run db:seed

      - name: Run full E2E
        run: npm run e2e:prepare && npm run build && npm run test:e2e:full:ci

  deploy-config:
    name: Deploy Config Check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      USE_MOCK_DATA: ${{ vars.USE_MOCK_DATA }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
      NEXT_PUBLIC_NAVER_MAP_KEY_ID: ${{ vars.NEXT_PUBLIC_NAVER_MAP_KEY_ID }}
      AUTH_KAKAO_CLIENT_ID: ${{ vars.AUTH_KAKAO_CLIENT_ID }}
      AUTH_KAKAO_CLIENT_SECRET: ${{ secrets.AUTH_KAKAO_CLIENT_SECRET }}
      AUTH_NAVER_CLIENT_ID: ${{ vars.AUTH_NAVER_CLIENT_ID }}
      AUTH_NAVER_CLIENT_SECRET: ${{ secrets.AUTH_NAVER_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check production deploy config
        run: npm run deploy:check
