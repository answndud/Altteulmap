services:
  postgres:
    image: postgres:17-alpine
    container_name: altteulmap-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: altteulmap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - altteulmap-postgres-data:/var/lib/postgresql/data

volumes:
  altteulmap-postgres-data:
